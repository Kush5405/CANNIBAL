<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CANNIBAL: The Optimized Vigilante</title>
<style>
  :root {
    --bg-main: #0a0c10;
    --panel-bg: #12161f;
    --border-color: #232b3b;
    --accent-red: #d32f2f;
    --accent-blue: #00bcd4;
    --accent-emerald: #00e676;
    --text-primary: #f5f5f5;
    --text-muted: #8c9ba5;
    --font-mono: 'Courier New', Courier, monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: var(--font-sans);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  #app-container {
    width: 100%;
    max-width: 900px;
    height: 640px;
    background-color: var(--panel-bg);
    border: 1px solid var(--border-color);
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  header {
    background: #080a0e;
    border-bottom: 1px solid var(--border-color);
    padding: 10px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }
  .hud-badge {
    padding: 3px 8px;
    border-radius: 3px;
    font-weight: bold;
  }
  .badge-red { background: rgba(211,47,47,0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
  .badge-blue { background: rgba(0,188,212,0.2); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
  .main-stage {
    flex: 1;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow-y: auto;
  }
  .story-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent-red);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .story-location {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 16px;
  }
  .story-box {
    background: rgba(0,0,0,0.4);
    border-left: 3px solid var(--accent-red);
    padding: 16px;
    font-size: 0.95rem;
    line-height: 1.6;
    min-height: 160px;
    color: #e0e0e0;
  }
  .actions-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 18px;
  }
  button {
    background: #18202c;
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 12px 14px;
    font-size: 0.88rem;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
    font-family: var(--font-sans);
  }
  button:hover {
    background: #222d3d;
    border-color: var(--accent-red);
    color: #fff;
    transform: translateY(-1px);
  }
  .combat-stats-bar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 14px;
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }
  .bar-container {
    width: 45%;
  }
  .hp-bar {
    height: 10px;
    background: #263238;
    border-radius: 2px;
    margin-top: 4px;
    overflow: hidden;
  }
  .hp-fill-player { height: 100%; width: 100%; background: var(--accent-emerald); transition: width 0.3s; }
  .hp-fill-enemy { height: 100%; width: 100%; background: var(--accent-red); transition: width 0.3s; }
  .log-console {
    background: #06080b;
    border: 1px solid #1a2230;
    padding: 10px;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    height: 110px;
    overflow-y: auto;
    color: var(--accent-blue);
    margin-bottom: 12px;
  }
</style>
</head>
<body>

<div id="app-container">
  <header>
    <div><span class="hud-badge badge-red">SYSTEM: CANNIBAL OS v4.2</span></div>
    <div id="status-display">CALCULUS: ACTIVE</div>
    <div><span class="hud-badge badge-blue" id="identity-display">TARGET: UNKNOWN</span></div>
  </header>

  <div class="main-stage" id="stage">
    <!-- Dynamic Interface Mounted by Engine -->
  </div>
</div>

<script>
/**
 * Game State & Narrative Graph
 */
const state = {
  chapter: 1,
  playerHp: 100,
  playerMaxHp: 100,
  enemyHp: 100,
  enemyMaxHp: 100,
  enemyName: "",
  molesFound: 0,
  visceraSpeed: 0,
  combatLog: []
};

const storyNodes = {
  start: {
    title: "Chapter 1: The Anatomy of a Disease",
    location: "TROPICAL JUNGLE // PUDUCHERRY OUTSKIRTS",
    text: "Rain soaks into the thick mud around your boots. The white fur coat is stained with fresh crimson. An elite private mercenary crawls across the filth, murmuring about mercy. He doesn't understand: kindness was a cage, and the man who wore that cage died with Dripti.",
    options: [
      { text: "Execute Calculus: Interrogate the mercenary", next: "ch1_interrogate" },
      { text: "Deploy Titanium Knife: Clean extraction", next: "ch1_combat_intro" }
    ]
  },
  ch1_interrogate: {
    title: "The S&P Checkbook",
    location: "RAIN-SOAKED CLEARING // 0300 HOURS",
    text: "You extract a leather-bound artifact from his gear: stamped with 'S&P Bank, Mumbai' and linked to Leonard Securities. The trail leads directly to Ahmed Patel, who operates out of an offshore luxury casino boat in Goa.",
    options: [
      { text: "Board the White Bird & fly to Goa", next: "ch4_goa_approach" }
    ]
  },
  ch1_combat_intro: {
    title: "Mercenary Squad Ambush",
    location: "JUNGLE CANOPY // POINT BLANK",
    text: "Laser sights paint your white tactical suit. Private dogs of Leonard Securities are attempting an envelopment.",
    options: [
      { text: "Engage Squad in Close-Quarters Combat", action: () => startCombat("Leonard Mercenary Squad", 80, "ch1_interrogate") }
    ]
  },
  ch4_goa_approach: {
    title: "Chapter 4: The Calculus of Chaos",
    location: "OFFSHORE CASINO BOAT // ARABIAN SEA",
    text: "You arrive disguised as Sean Dawson from Leonard Securities. Ahmed Patel is cornered in his soundproof suite. After clearing the corridor with silent precision, you return to find Patel has fractured his own thumb to slip the cuffs and fled through a dive-hatch, leaving an encrypted drive.",
    options: [
      { text: "Decrypt the drive & track Patel to Dubai", next: "ch5_dubai" }
    ]
  },
  ch5_dubai: {
    title: "Chapter 5: The Dubai Dead-Drop",
    location: "50TH FLOOR PENTHOUSE // DUBAI",
    text: "You breach the 50th-floor glass, but you're too late. Ahmed Patel is already dead—his ribcage crushed by the blunt-force calling card of the 6'5\" Overlord: The Big Guy. Dubai Tactical Police breach the suite immediately.",
    options: [
      { text: "Dive off the 50th floor into the alleyway", next: "ch6_viscera_escape" }
    ]
  },
  ch6_viscera_escape: {
    title: "Chapter 6: Absolute Friction",
    location: "VIP ALLEYWAY // CANNIBAL-VISCERA COCKPIT",
    text: "You land in the alleyway and jump into the matte-white Ferrari F76 Cannibal-Viscera. Three police interceptors block the exit onto Sheikh Zayed Road. You must engage the transmission and tactical countermeasures.",
    options: [
      { text: "Shift G1 Kinetic Launch & deploy Sonic Repulsors", next: "ch9_punjab_intercept" },
      { text: "Shift G5 Apex Override & launch Carbon Nets", next: "ch9_punjab_intercept" }
    ]
  },
  ch9_punjab_intercept: {
    title: "Chapter 9: The Northern Fracture",
    location: "ROADSIDE DHABA // DELHI-PUNJAB HIGHWAY",
    text: "You meet nineteen-year-old software prodigy Tanya Randhawa on the run from Colonial Constructions thugs. After neutralizing the goons with red chilli calculus and Kalaripayattu, you secure her onto the White Bird.",
    options: [
      { text: "Decode the Excavation Matrix (Project Manni)", next: "ch10_ghost_mirror" }
    ]
  },
  ch10_ghost_mirror: {
    title: "Chapter 10: The Ghost-Mirror Protocol",
    location: "WHITE BIRD TACTICAL LAB // UPPER STRATOSPHERE",
    text: "Tanya correlates the dig sites to Kurukshetra, New Delhi, and Madhya Pradesh. Guftaar Madaari is hunting the primordial 'Manni'. You must implant Tanya as a senior architect inside ShastraBhandaar Punjab while you monitor from orbit.",
    options: [
      { text: "Initialize Tanya's Infiltration & Audit Terminal", next: "ch19_terminal_hack" }
    ]
  },
  ch19_terminal_hack: {
    title: "Chapter 29: The Poetry of the Firewall",
    location: "SHASTRABHANDAAR PUNJAB // SANDBOX PARTITION",
    text: "Working alongside clean CFO Naveen Tripathi, Tanya isolates 5 internal syndicate moles laundering capital for Guftaar Madaari. Run the trace script to seal the indictment.",
    options: [
      { text: "Execute Deep Trace: Identify Joshi, Choithani, Malhotra, Saxena, Oberoi", next: "ch30_dwarka" }
    ]
  },
  ch30_dwarka: {
    title: "Chapter 30: The Dwarka Divergence",
    location: "WHITE BIRD COMMAND DECK // 60,000 FEET",
    text: "The satellite resonance script detects massive ionizing energy signatures beneath the drowned ruins of Dwarka. The primordial Manni is active. The final war against Madaari's cybernetic weapon, Sarmai Fauji, is locked.",
    options: [
      { text: "Enter Combat: Intercept Sarmai Fauji", action: () => startCombat("Sarmai Fauji (Cybernetic Asura)", 140, "victory_screen") }
    ]
  },
  victory_screen: {
    title: "Part 1 Complete: The Optimized Crusade",
    location: "THE DEN // SUBTERRANEAN LAKE VAULTS",
    text: "Fauji is repelled, the ShastraBhandaar leaks are purged, and the coordinates to the Manni stone in Dwarka are secured. Karan Padmaacharya pulls his white mask over his face once more. The hunt continues in Part 2.",
    options: [
      { text: "Restart Simulation", next: "start" }
    ]
  }
};

function renderNode(nodeKey) {
  const node = storyNodes[nodeKey];
  const stage = document.getElementById("stage");
  
  stage.innerHTML = `
    <div>
      <div class="story-title">${node.title}</div>
      <div class="story-location">[LOC] ${node.location}</div>
      <div class="story-box">${node.text}</div>
    </div>
    <div class="actions-grid" id="action-buttons"></div>
  `;

  const btnContainer = document.getElementById("action-buttons");
  node.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.innerHTML = `► ${opt.text}`;
    btn.onclick = () => {
      if (opt.action) {
        opt.action();
      } else if (opt.next) {
        renderNode(opt.next);
      }
    };
    btnContainer.appendChild(btn);
  });
}

function startCombat(enemyName, enemyHp, victoryNode) {
  state.enemyName = enemyName;
  state.enemyHp = enemyHp;
  state.enemyMaxHp = enemyHp;
  state.playerHp = 100;
  state.combatLog = [`Combat initialized against ${enemyName}.`];
  renderCombat(victoryNode);
}

function renderCombat(victoryNode) {
  const stage = document.getElementById("stage");
  const pPct = Math.max(0, (state.playerHp / state.playerMaxHp) * 100);
  const ePct = Math.max(0, (state.enemyHp / state.enemyMaxHp) * 100);

  stage.innerHTML = `
    <div>
      <div class="story-title">ENGAGEMENT: ${state.enemyName.toUpperCase()}</div>
      <div class="story-location">[CALCULUS OF SLAUGHTER] ACTIVE TARGET LOCK</div>
      
      <div class="combat-stats-bar">
        <div class="bar-container">
          <div>KARAN (CANNIBAL) - HP ${state.playerHp}/${state.playerMaxHp}</div>
          <div class="hp-bar"><div class="hp-fill-player" style="width: ${pPct}%;"></div></div>
        </div>
        <div class="bar-container">
          <div>${state.enemyName.toUpperCase()} - HP ${state.enemyHp}/${state.enemyMaxHp}</div>
          <div class="hp-bar"><div class="hp-fill-enemy" style="width: ${ePct}%;"></div></div>
        </div>
      </div>

      <div class="log-console" id="combat-console">
        ${state.combatLog.map(l => `<div>> ${l}</div>`).join("")}
      </div>
    </div>

    <div class="actions-grid">
      <button onclick="executeTurn('knife', '${victoryNode}')">► Tactical Combat Knife (22-28 DMG)</button>
      <button onclick="executeTurn('kalaripayattu', '${victoryNode}')">► Kalaripayattu Hyper-Extension (15-20 DMG + Stun)</button>
      <button onclick="executeTurn('firearm', '${victoryNode}')">► Suppressed Subsonic Round (30-38 DMG)</button>
      <button onclick="executeTurn('titanium_spear', '${victoryNode}')">► White Titanium Spear Thrust (35-45 DMG)</button>
    </div>
  `;

  const consoleEl = document.getElementById("combat-console");
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

function executeTurn(actionType, victoryNode) {
  let pDmg = 0;
  let moveName = "";

  if (actionType === 'knife') {
    pDmg = Math.floor(Math.random() * 7) + 22;
    moveName = "slashes with high-frequency titanium blade";
  } else if (actionType === 'kalaripayattu') {
    pDmg = Math.floor(Math.random() * 6) + 15;
    moveName = "executes bone-shattering Kalaripayattu joint strike";
  } else if (actionType === 'firearm') {
    pDmg = Math.floor(Math.random() * 9) + 30;
    moveName = "fires a precision subsonic round";
  } else if (actionType === 'titanium_spear') {
    pDmg = Math.floor(Math.random() * 11) + 35;
    moveName = "drives ancient-pattern titanium spear forward";
  }

  state.enemyHp -= pDmg;
  state.combatLog.push(`Karan ${moveName} for ${pDmg} DMG.`);

  if (state.enemyHp <= 0) {
    state.enemyHp = 0;
    state.combatLog.push(`Target neutralized.`);
    alert(`Target eliminated with mathematical precision.`);
    renderNode(victoryNode);
    return;
  }

  // Enemy counter-attack
  const eDmg = Math.floor(Math.random() * 10) + 12;
  state.playerHp -= eDmg;
  state.combatLog.push(`${state.enemyName} retaliates with kinetic force for ${eDmg} DMG.`);

  if (state.playerHp <= 0) {
    state.playerHp = 0;
    alert("Critical failure: The Cannibal has fallen. Restarting scenario...");
    renderNode("start");
    return;
  }

  renderCombat(victoryNode);
}

// Start Game
renderNode("start");
</script>
</body>
</html>
