<style>

    --card-bg: #0c1018;
    --border-red: #ff2a2a;

    --accent-red: #ff2a2a;
    --accent-cyan: #00f0ff;

  body {

    font-family: var(--font-body);

    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 1;
  }

  .crt-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle, rgba(0,0,0,0) 65%, rgba(0,0,0,0.85) 100%),

    background-size: 100% 100%, 100% 4px;
    z-index: 2;
    pointer-events: none;
  }

  header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 56px;
    background: rgba(5, 8, 13, 0.96);
    border-bottom: 1px solid rgba(0, 240, 255, 0.25);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    z-index: 100;
    backdrop-filter: blur(10px);
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }

  .progress-track {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.08);
  }
  #progress-bar {
    height: 100%;
    width: 0%;
    background: var(--accent-red);
    box-shadow: 0 0 12px var(--accent-red);
    transition: width 0.1s linear;
  }

  .hud-btn {
    background: transparent;
    border: 1px solid var(--border-cyan);
    color: var(--accent-cyan);
    padding: 5px 12px;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
  }
  .hud-btn:hover {
    background: var(--accent-cyan);
    color: #000;
    box-shadow: 0 0 10px var(--accent-cyan);

  #toc-drawer {
    position: fixed;
    top: 56px;
    right: -320px;
    width: 300px;
    height: calc(100vh - 56px);
    background: rgba(8, 12, 18, 0.98);
    border-left: 1px solid var(--border-cyan);
    z-index: 99;
    padding: 20px;
    overflow-y: auto;
    transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);

    font-size: 0.78rem;
  }

  .toc-item {
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    color: #8c9ba5;
    cursor: pointer;
  }
  .toc-item:hover { color: var(--accent-cyan); }

    z-index: 10;
    max-width: 860px;

    display: flex;
    flex-direction: column;
    gap: 80px;

    box-shadow: 0 20px 50px rgba(0,0,0,0.9);

<script>
/**
 * -------------------------------------------------------------
 * 1. 3D GRAPHIC PARTICLES & GRID (THREE.JS)
 * -------------------------------------------------------------
 */
let scene, camera, renderer, particles, wireMesh;

function init3D() {
  const container = document.getElementById("webgl-canvas");
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 32;

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  const gridHelper = new THREE.GridHelper(120, 50, 0x00f0ff, 0x112233);
  gridHelper.rotation.x = Math.PI / 2.4;
  gridHelper.position.y = -12;
  scene.add(gridHelper);

  const pCount = 1200;
  const geom = new THREE.BufferGeometry();
  const pos = new Float32Array(pCount * 3);
  for (let i = 0; i < pCount * 3; i += 3) {
    pos[i] = (Math.random() - 0.5) * 120;
    pos[i+1] = (Math.random() - 0.5) * 120;
    pos[i+2] = (Math.random() - 0.5) * 120;
  }
  geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  particles = new THREE.Points(geom, new THREE.PointsMaterial({ color: 0x00f0ff, size: 0.35, transparent: true, opacity: 0.6 }));
  scene.add(particles);

  wireMesh = new THREE.Mesh(
    new THREE.IcosahedronGeometry(7, 1),
    new THREE.MeshBasicMaterial({ color: 0xff2a2a, wireframe: true })
  );
  scene.add(wireMesh);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  animate3D();
}

function animate3D() {
  requestAnimationFrame(animate3D);
  if (particles) { particles.rotation.y += 0.0008; particles.rotation.x += 0.0004; }
  if (wireMesh) { wireMesh.rotation.x += 0.004; wireMesh.rotation.y += 0.006; }
  renderer.render(scene, camera);
}

/**
 * -------------------------------------------------------------
 * 2. WEB AUDIO PROCEDURAL SYNTHESIZER
 * -------------------------------------------------------------
 */
let audioCtx = null;
let audioEnabled = false;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'rain') {
    osc.type = 'pink';
    osc.frequency.setValueAtTime(100, now);
    gain.gain.setValueAtTime(0.04, now);
    gain.gain.linearRampToValueAtTime(0.001, now + 1.2);
    osc.start(now); osc.stop(now + 1.2);
  } else if (type === 'blade') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(550, now);
    osc.frequency.exponentialRampToValueAtTime(110, now + 0.25);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    osc.start(now); osc.stop(now + 0.25);
  } else if (type === 'engine') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(85, now);
    osc.frequency.exponentialRampToValueAtTime(340, now + 0.7);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
    osc.start(now); osc.stop(now + 0.7);
  } else if (type === 'gunshot') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(25, now + 0.25);
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    osc.start(now); osc.stop(now + 0.25);
  } else if (type === 'alarm') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, now);
    osc.frequency.setValueAtTime(400, now + 0.15);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc.start(now); osc.stop(now + 0.3);
  }
}

function toggleAudioEngine() {
  initAudio();
  audioEnabled = !audioEnabled;
  const btn = document.getElementById("audio-btn");
  if (audioEnabled) {
    btn.innerText = "SOUND: ON";
    btn.style.background = "var(--accent-cyan)";
    btn.style.color = "#000";
    playSound('blade');
  } else {
    btn.innerText = "SOUND: OFF";
    btn.style.background = "transparent";
    btn.style.color = "var(--accent-cyan)";
  }
}

/**
 * -------------------------------------------------------------
 * 5. MOUNTING PANELS & SCROLL TRACKER
 * -------------------------------------------------------------
 */
const comicStream = document.getElementById("comic-stream");
const tocList = document.getElementById("toc-list");

chapters.forEach((chap) => {
  // Mount TOC
  const tocItem = document.createElement("div");
  tocItem.className = "toc-item";
  tocItem.innerText = `CH ${chap.num}: ${chap.title}`;
  tocItem.onclick = () => {
    document.getElementById(`chapter-${chap.num}`).scrollIntoView({ behavior: 'smooth' });
    toggleToc();
  };
  tocList.appendChild(tocItem);

  // Mount Comic Panel Card
  const panel = document.createElement("section");
  panel.className = `comic-panel ${chap.danger ? 'danger' : ''}`;
  panel.id = `chapter-${chap.num}`;
  panel.setAttribute('data-sound', chap.sound || 'blade');
  panel.setAttribute('data-indicator', `CH ${chap.num}: ${chap.title.toUpperCase()}`);

  let balloonHtml = "";
  if (chap.balloon) {
    balloonHtml = `
      <div class="speech-balloon ${chap.balloon.style}">
        <span class="balloon-speaker">${chap.balloon.speaker}</span>
        "${chap.balloon.text}"
      </div>
    `;
  }

  panel.innerHTML = `
    <div class="caption-header">
      <span class="act-tag">CHAPTER ${chap.num}</span>
      <div class="location-tag">${chap.loc}</div>
    </div>
    <div class="panel-artwork-frame">
      ${getPanelArtSVG(chap.art, chap.title)}
    </div>
    <div class="panel-content">
      <h2 class="chapter-heading">${chap.title}</h2>
      <div class="narrative-prose">${chap.text}</div>
      ${chap.sfx ? `<div class="sfx-word">${chap.sfx}</div>` : ''}
      ${balloonHtml}
    </div>
  `;
  comicStream.appendChild(panel);
});

// Mount Final In-Universe Concluding Splash Card (No share button)
const finalSplash = document.createElement("div");
finalSplash.className = "final-splash-panel";
finalSplash.innerHTML = `
  <span class="act-tag" style="border-color: var(--accent-red); color: var(--accent-red);">CHRONICLE COMPLETE</span>
  <h1 class="chapter-heading" style="color: var(--accent-red); font-size: 2.4rem; margin: 14px 0;">CANNIBAL: PART 1 CONCLUDED</h1>
  <p style="color: #94a3b8; max-width: 580px; margin: 0 auto; font-size: 1rem; font-family: var(--font-mono);">
    Written by Kushagra Singh (Copyright © 2026)[cite: 1].<br/>The entire 40-chapter tech-noir vigilante epic is logged[cite: 1].
  </p>
`;
comicStream.appendChild(finalSplash);

// Scroll Engine & Progress Bar
const progressBar = document.getElementById('progress-bar');
const liveIndicator = document.getElementById('live-chapter-indicator');
const panels = document.querySelectorAll('.comic-panel');

window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const scrollPercent = (scrollTop / docHeight) * 100;
  progressBar.style.width = scrollPercent + '%';
});

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      const sound = entry.target.getAttribute('data-sound');
      const ind = entry.target.getAttribute('data-indicator');
      if (ind) liveIndicator.innerText = ind;
      if (sound) playSound(sound);
    }
  });
}, { threshold: 0.25 });

panels.forEach(p => observer.observe(p));

function toggleToc() {
  document.getElementById("toc-drawer").classList.toggle("open");
}

window.onload = () => {
  init3D();
};
</script>
