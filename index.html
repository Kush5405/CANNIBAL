/**
 * -------------------------------------------------------------
 * 1. 3D WEBGL AMBIENCE (THREE.JS)
 * -------------------------------------------------------------
 */
let scene, camera, renderer, particles, wireMesh;

function init3D() {
  const container = document.getElementById("webgl-canvas");
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 32;

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  const gridHelper = new THREE.GridHelper(120, 50, 0x00f0ff, 0x112233);
  gridHelper.rotation.x = Math.PI / 2.4;
  gridHelper.position.y = -12;
  scene.add(gridHelper);

  const pCount = 1200;
  const geom = new THREE.BufferGeometry();
  const pos = new Float32Array(pCount * 3);
  for (let i = 0; i < pCount * 3; i += 3) {
    pos[i] = (Math.random() - 0.5) * 120;
    pos[i+1] = (Math.random() - 0.5) * 120;
    pos[i+2] = (Math.random() - 0.5) * 120;
  }
  geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  particles = new THREE.Points(geom, new THREE.PointsMaterial({ color: 0x00f0ff, size: 0.35, transparent: true, opacity: 0.6 }));
  scene.add(particles);

  wireMesh = new THREE.Mesh(
    new THREE.IcosahedronGeometry(7, 1),
    new THREE.MeshBasicMaterial({ color: 0xff2a2a, wireframe: true })
  );
  scene.add(wireMesh);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  animate3D();
}

function animate3D() {
  requestAnimationFrame(animate3D);
  if (particles) { particles.rotation.y += 0.0008; particles.rotation.x += 0.0004; }
  if (wireMesh) { wireMesh.rotation.x += 0.004; wireMesh.rotation.y += 0.006; }
  renderer.render(scene, camera);
}

/**
 * -------------------------------------------------------------
 * 2. PROCEDURAL SOUND SYNTHESIZER (WEB AUDIO API)
 * -------------------------------------------------------------
 */
let audioCtx = null;
let audioEnabled = false;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'rain') {
    osc.type = 'pink';
    osc.frequency.setValueAtTime(100, now);
    gain.gain.setValueAtTime(0.04, now);
    gain.gain.linearRampToValueAtTime(0.001, now + 1.2);
    osc.start(now); osc.stop(now + 1.2);
  } else if (type === 'blade') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(550, now);
    osc.frequency.exponentialRampToValueAtTime(110, now + 0.25);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    osc.start(now); osc.stop(now + 0.25);
  } else if (type === 'engine') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(85, now);
    osc.frequency.exponentialRampToValueAtTime(340, now + 0.7);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
    osc.start(now); osc.stop(now + 0.7);
  } else if (type === 'gunshot') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(25, now + 0.25);
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    osc.start(now); osc.stop(now + 0.25);
  } else if (type === 'alarm') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, now);
    osc.frequency.setValueAtTime(400, now + 0.15);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc.start(now); osc.stop(now + 0.3);
  }
}

function toggleAudioEngine() {
  initAudio();
  audioEnabled = !audioEnabled;
  const btn = document.getElementById("audio-btn");
  if (audioEnabled) {
    btn.innerText = "SOUND: ON";
    btn.style.background = "var(--accent-cyan)";
    btn.style.color = "#000";
    playSound('blade');
  } else {
    btn.innerText = "SOUND: OFF";
    btn.style.background = "transparent";
    btn.style.color = "var(--accent-cyan)";
  }
}

/**
 * -------------------------------------------------------------
 * 4. MOUNTING AND INTERSECTION OBSERVERS
 * -------------------------------------------------------------
 */
const comicStream = document.getElementById("comic-stream");
const tocList = document.getElementById("toc-list");

chaptersData.forEach((chap) => {
  // Mount TOC Item
  const tocItem = document.createElement("div");
  tocItem.className = "toc-item";
  tocItem.innerText = `CH ${chap.num}: ${chap.title}`;
  tocItem.onclick = () => {
    document.getElementById(`chapter-${chap.num}`).scrollIntoView({ behavior: 'smooth' });
    toggleToc();
  };
  tocList.appendChild(tocItem);

  // Mount Comic Panel
  const panel = document.createElement("section");
  panel.className = `panel ${chap.danger ? 'danger' : ''}`;
  panel.id = `chapter-${chap.num}`;
  panel.setAttribute('data-sound', chap.sound || 'blade');
  panel.setAttribute('data-indicator', `CH ${chap.num}: ${chap.title.toUpperCase()}`);

  let dialogueHtml = "";
  if (chap.dialogue) {
    let dClass = chap.dialogue.karan ? "karan" : (chap.dialogue.madaari ? "madaari" : "");
    dialogueHtml = `
      <div class="dialogue ${dClass}">
        <span class="speaker">${chap.dialogue.speaker}</span>
        "${chap.dialogue.text}"
      </div>
    `;
  }

  panel.innerHTML = `
    <span class="act-badge">Chapter ${chap.num} // Arc Protocol</span>
    <h2 class="chapter-heading">${chap.title}</h2>
    <div class="location-tag">[LOC] ${chap.loc}</div>
    <div class="prose">${chap.text}</div>
    ${chap.sfx ? `<div class="sfx-word">${chap.sfx}</div>` : ''}
    ${dialogueHtml}
    ${chap.spec ? `<div class="spec-box">${chap.spec}</div>` : ''}
  `;
  comicStream.appendChild(panel);
});

// Mount Final End Card
const endCard = document.createElement("div");
endCard.className = "final-cta-card";
endCard.innerHTML = `
  <span class="act-badge">Chronicle Complete</span>
  <h2 class="chapter-heading" style="color: var(--accent-red);">CANNIBAL: PART 1 CONCLUDED</h2>
  <p style="color: #a0b2c6; max-width: 580px; margin: 12px auto; font-size: 0.95rem;">
    Written by Kushagra Singh (Copyright © 2026)[cite: 1]. The entire 40-chapter tech-noir vigilante saga is logged[cite: 1].
  </p>
  <button class="share-btn" onclick="shareOperationalRecord()">SHARE THIS RECORD (COPY LINK)</button>
`;
comicStream.appendChild(endCard);

/**
 * -------------------------------------------------------------
 * 5. SCROLL ENGINE & PROGRESS TRACKER
 * -------------------------------------------------------------
 */
const progressBar = document.getElementById('progress-bar');
const liveIndicator = document.getElementById('live-chapter-indicator');
const panels = document.querySelectorAll('.panel');

window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const scrollPercent = (scrollTop / docHeight) * 100;
  progressBar.style.width = scrollPercent + '%';
});

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      const sound = entry.target.getAttribute('data-sound');
      const ind = entry.target.getAttribute('data-indicator');
      if (ind) liveIndicator.innerText = ind;
      if (sound) playSound(sound);
    }
  });
}, { threshold: 0.25 });

panels.forEach(p => observer.observe(p));

function toggleToc() {
  document.getElementById("toc-drawer").classList.toggle("open");
}

function shareOperationalRecord() {
  const shareText = "Experience 'CANNIBAL: The Optimized Vigilante' (Complete 40-Chapter Interactive Saga): " + window.location.href;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(shareText).then(() => {
      alert("Operational Link Copied to Clipboard! Ready to paste on Twitter/X, Discord, or Instagram.");
    });
  } else {
    alert(shareText);
  }
}

window.onload = () => {
  init3D();
};
